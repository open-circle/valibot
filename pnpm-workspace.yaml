packages:
  - 'codemod/*'
  - 'library'
  - 'packages/*'
  - 'website'
minimumReleaseAge: 10080 # minutes — 7 days
allowBuilds:
  '@ast-grep/cli': true
  '@vercel/speed-insights': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/workerd-darwin-64@1.20260616.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260616.1'
  - '@cloudflare/workerd-linux-64@1.20260616.1'
  - '@cloudflare/workerd-linux-arm64@1.20260616.1'
  - '@cloudflare/workerd-windows-64@1.20260616.1'
  - miniflare@4.20260616.0
  - workerd@1.20260616.1
  - wrangler@4.101.0
  - tar@7.5.21
  - valibot@1.5.0
overrides:
  '@vercel/static-config>ajv': '^8.18.0'
  '@vercel/fun>@tootallnate/once': '^2.0.1'
  'satori>fflate@0.7': '^0.7.5'
  'path-to-regexp@8': '^8.4.0'
  'vite-imagetools@9>sharp': '^0.35.5'
  '@vercel/cervel>srvx': '^0.11.13'
  'glob@10': '^14.0.2'
  'glob@13': '^14.0.2'
  'minimatch@9': '^11.0.1'
  'minimatch@10': '^11.0.1'
  '@vercel/blob@1>undici': '6.29.1'
  '@vercel/node>undici': '6.29.1'
  'path-to-regexp@6.1.0': '6.3.0'
  'monaco-editor@0.55.1>dompurify': '^3.4.0'
  # Security: pin vulnerable transitive deps to patched versions (CVE Lite findings).
  # Keyed by major so only the affected major line is moved to its fixed version.
  'shell-quote@1': '1.11.0'
  # tar@6 has no patched 6.x release (all fixes landed in 7.5.19+). Its only
  # consumer (@vercel/fun) uses tar APIs that are unchanged in v7, so both
  # major lines are moved to the patched v7 version.
  'tar@6': '7.5.21'
  'tar@7': '7.5.21'
  # simple-git@3 has no patched 3.x release (fixes landed in 4.0.1). Its only
  # consumer (@codemod.com/workflow) is used for types only by the v0.31.0
  # codemod, so the v3 line is moved to the patched v4 version.
  'simple-git@3': '4.0.2'
patchedDependencies:
  '@builder.io/qwik-city@1.20.4': patches/@builder.io__qwik-city@1.20.4.patch
