name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  default_ci:
    name: Run default CI of repository
    permissions:
      contents: read
      # Required by the reusable workflow's PR preview job, even when skipped.
      pull-requests: write
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and upload release artifacts
    needs: default_ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/environment

      - name: Build i18n npm
        run: pnpm build.npm
        working-directory: packages/i18n

      - name: Upload i18n npm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i18n-npm-release
          path: packages/i18n
          if-no-files-found: error
          retention-days: 1

      - name: Build i18n JSR
        run: pnpm build.jsr
        working-directory: packages/i18n

      - name: Upload i18n JSR artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i18n-jsr-release
          path: packages/i18n
          if-no-files-found: error
          retention-days: 1

      - name: Upload library release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: library-release
          path: library
          if-no-files-found: error
          retention-days: 1

      - name: Upload to-json-schema release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: to-json-schema-release
          path: packages/to-json-schema
          if-no-files-found: error
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # npm
  # ────────────────────────────────────────────────────────────────────────────
  npm_stage:
    name: Stage ${{ matrix.package }} on npm
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: library
            artifact: library-release
          - package: i18n
            artifact: i18n-npm-release
          - package: to-json-schema
            artifact: to-json-schema-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publishing.
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Download ${{ matrix.package }} release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: artifact

      - name: Stage ${{ matrix.package }}
        shell: bash
        run: |
          set -euo pipefail
          cd artifact
          npm stage publish --ignore-scripts

  # ────────────────────────────────────────────────────────────────────────────
  # JSR
  # ────────────────────────────────────────────────────────────────────────────
  jsr_publish:
    name: Publish ${{ matrix.package }} to JSR
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: library
            artifact: library-release
          - package: i18n
            artifact: i18n-jsr-release
          - package: to-json-schema
            artifact: to-json-schema-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for JSR OIDC publishing.
    steps:
      - name: Download ${{ matrix.package }} release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: artifact

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.5.6

      - name: Publish ${{ matrix.package }}
        shell: bash
        run: |
          set -euo pipefail
          cd artifact
          deno publish
