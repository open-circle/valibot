version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/library"
      - "/packages/*"
      - "/website"
      - "/codemod/*"
    schedule:
      interval: weekly
      day: "saturday"
      time: "09:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "dependabot"
    groups:
      # Stable dependencies (>= 1.0.0). Safe to batch into a single PR.
      npm-deps:
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "*"
        exclude-patterns:
          - "@codemod.com/workflow"
          - "@vercel/og"
          - "monaco-editor"
          - "prettier-plugin-tailwindcss"
          - "satori-html"
          - "sharp"
          - "tsdown"
          - "vite-plugin-node-polyfills"
      # Dependencies still in v0. Semver allows breaking changes in minor
      # releases, which Dependabot classifies as `semver-minor` and therefore
      # does not filter out. Keep them in a separate PR so that each bump can
      # be reviewed and verified on its own.
      unstable-deps:
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "@codemod.com/workflow"
          - "@vercel/og"
          - "monaco-editor"
          - "prettier-plugin-tailwindcss"
          - "satori-html"
          - "sharp"
          - "tsdown"
          - "vite-plugin-node-polyfills"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: "saturday"
      time: "09:00"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "dependabot"
    groups:
      github-actions:
        update-types:
          - "patch"
          - "minor"
        patterns:
          - '*'
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

